name: RaceDay CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore RaceDay.API/RaceDay.API.sln

      - name: Build solution (API + Web + Tests)
        run: dotnet build RaceDay.API/RaceDay.API.sln --no-restore --configuration Release

      - name: Run unit tests
        run: dotnet test RaceDayAPI.Tests/RaceDayAPI.Tests.csproj --no-build --configuration Release --verbosity normal
